<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Rock Paper Scissor Game</h1>
    </header>
    <body>
        <section class="choice">
            <img id="rock" src="Images/Rock.png" alt="Rock" title="Rock">
            <img id="paper" src="Images/Paper.png" alt="Paper" title="Paper">
            <img id="scissor" src="Images/Scissor.png" alt="Scissor" title="Scissor">
        </section>
        <section class="score_board">
            <div class="score">
                <p id="user-score">0</p>
                <p>You</p>
            </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>Computer</p>
            </div>
        </section>
        <section class="msg">
            <p>Pick your Choice!</p>
        </section>
    </body>
    <script src="app.js"></script>
</body>
</html>
